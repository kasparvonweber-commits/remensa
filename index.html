<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Remensa</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #0E0B12;           /* Supermörkt lila, nästan svart */
    --surface: #16121D;      /* Något ljusare lila för kort och menyer */
    --ink: #D1CDC7; 
    --ink-soft: #A6A29A; 
    --ink-faint: #312B3D;    /* Anpassad för att synas mot den mörka lila */
    --accent: #C4402A; 
    --border: #221B2B;       /* Subtil lila nyans på kanterna */
    --shadow: 0 4px 20px rgba(0,0,0,0.5); 
    --radius: 12px;
    --purple: #9b51e0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }

  #loading { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1rem; }
  .spinner { width:32px; height:32px; border:2.5px solid var(--border); border-top-color:var(--ink); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  #auth-screen { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2rem; }
  .auth-logo { font-family:'DM Serif Display',serif; font-size:3.5rem; color:var(--ink); margin-bottom:.25rem; letter-spacing:-1px; line-height:1; }
  .auth-tag { color:var(--ink-soft); font-size:.95rem; font-weight:300; margin-bottom:3rem; letter-spacing:.05em; text-transform: lowercase; }
  .google-btn { display:flex; align-items:center; gap:.75rem; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:.875rem 1.5rem; font-family:'Inter',sans-serif; font-size:.95rem; font-weight:500; color:var(--ink); cursor:pointer; transition:all .2s; }
  .google-btn:hover { border-color:var(--ink-soft); }
  .google-btn svg { width:20px; height:20px; flex-shrink:0; }

  #app { display:none; min-height:100vh; display:flex; flex-direction:column; }

  header { background:var(--surface); border-bottom:1px solid var(--border); padding:.875rem 1.25rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
  .logo { font-family:'DM Serif Display',serif; font-size:1.5rem; color:var(--ink); letter-spacing:-.5px; cursor:pointer; line-height:1; }
  .avatar { width:30px; height:30px; border-radius:50%; object-fit:cover; border:2px solid var(--border); cursor:pointer; }

  .view { display:none; flex:1; max-width:700px; width:100%; margin:0 auto; padding:1.25rem; padding-bottom:7rem; }
  .view.active { display:block; }

  .filter-bar { display:flex; gap:.5rem; overflow-x:auto; padding-bottom:.75rem; margin-bottom:.75rem; scrollbar-width:none; }
  .filter-bar::-webkit-scrollbar { display:none; }
  .tag-btn { background:var(--bg); border:1.5px solid var(--border); border-radius:20px; padding:.4rem .875rem; font-family:'Inter',sans-serif; font-size:.85rem; color:var(--ink-soft); cursor:pointer; white-space:nowrap; transition:all .15s; }
  .tag-btn.active { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:500; }

  .recipe-card { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:1rem; margin-bottom:.75rem; cursor:pointer; transition:border-color .15s; display:flex; flex-direction:column; gap:.5rem; }
  .recipe-card:hover { border-color:var(--ink-soft); }
  .rc-title { font-size:1.1rem; font-weight:600; color:var(--ink); }
  .rc-meta { font-size:.8rem; color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center; }
  .rc-tags { display:flex; gap:.3rem; flex-wrap:wrap; }
  .rc-tag { background:var(--bg); border:1px solid var(--border); padding:.2rem .5rem; border-radius:12px; font-size:.7rem; color:var(--ink-soft); }

  .rv-header { margin-bottom:1.5rem; }
  .rv-title { font-family:'DM Serif Display',serif; font-size:2rem; color:var(--ink); line-height:1.1; margin-bottom:.75rem; width:100%; background:transparent; border:none; outline:none; }
  .rv-title:focus { border-bottom:1px solid var(--ink-soft); }
  
  .rv-tags-edit { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1.5rem; align-items:center; }
  .tag-edit { background:var(--surface); border:1px solid var(--border); padding:.3rem .6rem; border-radius:16px; font-size:.8rem; color:var(--ink); display:flex; align-items:center; gap:.4rem; }
  .tag-rm { cursor:pointer; color:var(--ink-faint); font-weight:bold; }
  .tag-rm:hover { color:var(--accent); }
  .tag-input { background:transparent; border:none; color:var(--ink); font-family:'Inter',sans-serif; font-size:.85rem; outline:none; width:120px; padding:.3rem; }
  .tag-input::placeholder { color:var(--ink-faint); }

  .rv-stats { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.75rem; margin-bottom:1.5rem; }
  .stat-summary { display:flex; justify-content:space-between; align-items:center; font-size:.85rem; color:var(--ink-soft); }
  .stat-text { cursor:pointer; border-bottom:1px dashed var(--ink-faint); padding-bottom:2px; }
  .stat-text:hover { color:var(--ink); }
  .cook-btn { background:var(--ink); color:var(--bg); border:none; border-radius:6px; padding:.4rem .8rem; font-family:'Inter',sans-serif; font-size:.8rem; font-weight:600; cursor:pointer; }
  .cook-btn:active { transform:scale(0.95); }
  
  .stat-list { display:none; margin-top:.75rem; border-top:1px solid var(--border); padding-top:.75rem; font-size:.8rem; color:var(--ink-faint); max-height:250px; overflow-y:auto; }
  .stat-list.open { display:block; }
  .stat-item { margin-bottom:.5rem; }

  .rv-content { width:100%; min-height:400px; background:transparent; border:none; color:var(--ink); font-family:'Inter',sans-serif; font-size:1rem; line-height:1.6; outline:none; resize:none; }

  .bottom-bar { position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border); padding:.75rem 1.25rem; padding-bottom:calc(.75rem + env(safe-area-inset-bottom)); z-index:90; display:flex; gap:.625rem; align-items:center; justify-content:flex-end; }
  .btm-btn { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:.6rem 1rem; font-family:'Inter',sans-serif; font-size:.9rem; font-weight:500; color:var(--ink); cursor:pointer; display:flex; align-items:center; gap:.4rem; transition:all .15s; }
  .btm-btn:hover { border-color:var(--ink-soft); }
  .btm-btn.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }

  /* Modal för betyg */
  .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center; padding:1.5rem; }
  .modal-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; width:100%; max-width:400px; display:flex; flex-direction:column; gap:1.2rem; box-shadow: var(--shadow); }
  .modal-title { font-family:'DM Serif Display',serif; font-size:1.5rem; color:var(--ink); }
  .stars-container { display:flex; gap:0.5rem; font-size:2.5rem; cursor:pointer; user-select:none; justify-content: center; }
  .star { color: var(--ink-faint); transition: color 0.2s; }
  .modal-textarea { width:100%; background:var(--bg); border:1px solid var(--border); color:var(--ink); font-family:'Inter',sans-serif; padding:0.75rem; border-radius:8px; resize:vertical; min-height:100px; outline:none; }
  .modal-actions { display:flex; justify-content:flex-end; gap:0.75rem; margin-top:0.5rem; }

  .toast { position:fixed; bottom:6rem; left:50%; transform:translateX(-50%) translateY(100px); background:var(--ink); color:var(--bg); padding:.75rem 1.25rem; border-radius:var(--radius); font-size:.875rem; z-index:999; transition:transform .3s ease; white-space:nowrap; pointer-events:none; }
  .toast.show { transform:translateX(-50%) translateY(0); }
/* Ny klass för att anpassa logotyp-emojin */
  .logo-emoji {
.logo-emoji {
    font-size: 1.3em; /* Ökat för att kompensera för emojins inbyggda marginaler */
    vertical-align: -0.12em; /* Justerar ner emojin så den står stadigt på samma linje som texten */
    line-height: 0;
    display: inline-block;
  }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div></div>

<div id="auth-screen" style="display:none">
  <div class="auth-logo">Remensa<span class="logo-emoji">🍽️</span></div>
  <div class="auth-tag">din personliga kokbok</div>
  <button class="google-btn" onclick="signInWithGoogle()">
    <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
    Logga in med Google
  </button>
</div>

<div id="app">
  <header>
    <div class="logo" onclick="goHome()">Remensa<span class="logo-emoji">🍽️</span></div>
    <img id="avatar" class="avatar" src="" alt="" onclick="signOut()">
  </header>

  <div id="view-list" class="view active">
    <div class="filter-bar" id="filter-bar"></div>
    <div id="recipe-list"></div>
    <div class="bottom-bar">
      <button class="btm-btn primary" onclick="createRecipe()">+ Nytt recept</button>
    </div>
  </div>

  <div id="view-recipe" class="view">
    <div class="rv-header">
      <input type="text" class="rv-title" id="rv-title" placeholder="Namn på rätten..." onblur="saveRecipe()">
  <div class="rv-tags-edit" id="rv-tags-edit">
       <input type="text" list="tag-suggestions" autocomplete="off" class="tag-input" id="tag-input" placeholder="+ Lägg till etikett" onkeydown="if(event.key==='Enter') addTagToRecipe(this)">
      </div>
      <datalist id="tag-suggestions"></datalist>
  
      <div class="rv-stats">
        <div class="stat-summary">
          <span class="stat-text" id="stat-text" onclick="toggleStats()">Lagad 0 gånger</span>
          <button class="cook-btn" onclick="cookToday()">Lagat idag!</button>
        </div>
        <div class="stat-list" id="stat-list"></div>
      </div>
    </div>
    
    <textarea class="rv-content" id="rv-content" placeholder="Klistra in ingredienser och instruktioner här..." onblur="saveRecipe()" oninput="autoGrow(this)"></textarea>
    
    <div class="bottom-bar">
      <button class="btm-btn" style="color:var(--accent); border-color:transparent;" onclick="deleteRecipe()">Ta bort</button>
      <button class="btm-btn" onclick="goHome()">Stäng</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="rating-modal">
  <div class="modal-box">
    <div class="modal-title">Betygsätt rätten</div>
    <div class="stars-container">
      <span class="star" id="star-1" onclick="setRating(1)">★</span>
      <span class="star" id="star-2" onclick="setRating(2)">★</span>
      <span class="star" id="star-3" onclick="setRating(3)">★</span>
      <span class="star" id="star-4" onclick="setRating(4)">★</span>
      <span class="star" id="star-5" onclick="setRating(5)">★</span>
    </div>
    <textarea class="modal-textarea" id="rating-comment" placeholder="Kommentar (valfritt)... Hur gillade dottern det? Vad ändrar vi nästa gång?"></textarea>
    <div class="modal-actions">
      <button class="btm-btn" onclick="closeRatingModal()">Hoppa över</button>
      <button class="btm-btn primary" onclick="saveRating()">Spara</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cfg = {
  apiKey:"AIzaSyCiTNrzw79kn5MpVnCiEY5ym6haHx6_X1M",
  authDomain:"willdo-2f23b.firebaseapp.com",
  projectId:"willdo-2f23b",
  storageBucket:"willdo-2f23b.firebasestorage.app",
  messagingSenderId:"780576068769",
  appId:"1:780576068769:web:023ccea934d01aaddb0ce0"
};
const fa = initializeApp(cfg);
const auth = getAuth(fa);
const db = getFirestore(fa);

let user = null, recipes = [];
let activeFilters = new Set();
let currentRecipeId = null;
let tempRating = 0;

onAuthStateChanged(auth, u => {
  document.getElementById('loading').style.display='none';
  if(u){
    user = u;
    document.getElementById('auth-screen').style.display='none';
    document.getElementById('app').style.display='flex';
    if(u.photoURL) document.getElementById('avatar').src=u.photoURL;
    subscribe();
  } else {
    user = null;
    document.getElementById('auth-screen').style.display='flex';
    document.getElementById('app').style.display='none';
  }
});

function subscribe() {
  onSnapshot(collection(db, 'users', user.uid, 'recipes'), snap => {
    recipes = snap.docs.map(d => ({id: d.id, ...d.data()}));
    if(curView() === 'list') renderList();
    if(curView() === 'recipe' && currentRecipeId) renderRecipeData();
  });
}

function switchView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  window.scrollTo(0,0);
}

window.goHome = () => {
  currentRecipeId = null;
  switchView('list');
  renderList();
};

window.openRecipe = (id) => {
  currentRecipeId = id;
  switchView('recipe');
  renderRecipeData();
};

// --- LOGIK FÖR LISTAN OCH SORTERING ---
function renderList() {
  const allTags = new Set();
  recipes.forEach(r => (r.tags||[]).forEach(t => allTags.add(t)));
  
  const fBar = document.getElementById('filter-bar');
  fBar.innerHTML = '';
  Array.from(allTags).sort().forEach(tag => {
    const btn = document.createElement('button');
    btn.className = `tag-btn ${activeFilters.has(tag) ? 'active' : ''}`;
    btn.innerText = tag;
    btn.onclick = () => {
      activeFilters.has(tag) ? activeFilters.delete(tag) : activeFilters.add(tag);
      renderList();
    };
    fBar.appendChild(btn);
  });

  const sorted = [...recipes].sort((a, b) => getScore(b) - getScore(a));
  
  const c = document.getElementById('recipe-list');
  c.innerHTML = '';
  sorted.forEach(r => {
    const dates = r.cookedDates || [];
    let lastCookedText = 'Aldrig lagad';
    if(dates.length > 0) {
      const lastEntry = dates.sort((x,y) => new Date(y.date || y) - new Date(x.date || x))[0];
      const last = lastEntry.date || lastEntry;
      lastCookedText = `Senast: ${new Date(last).toLocaleDateString('sv-SE', {day:'numeric', month:'short'})}`;
    }

    // Beräkna snittbetyg för stjärnorna
    const ratings = dates.filter(d => d.rating).map(d => d.rating);
    const avg = ratings.length ? ratings.reduce((a, b) => a + b, 0) / ratings.length : 0;
    const starsHtml = getStarsHtml(avg, r.id);

    const tagsHtml = (r.tags||[]).map(t => `<span class="rc-tag">${esc(t)}</span>`).join('');
    
    c.innerHTML += `
      <div class="recipe-card" onclick="openRecipe('${r.id}')">
        <div class="rc-title">${esc(r.title || 'Namnlöst recept')}</div>
        <div class="rc-tags">${tagsHtml}</div>
        <div class="rc-meta">
          <span>${lastCookedText}</span>
          ${starsHtml}
        </div>
      </div>
    `;
  });
}

function getScore(recipe) {
  let score = 0;
  if (activeFilters.size > 0) {
    let match = 0;
    (recipe.tags||[]).forEach(t => { if(activeFilters.has(t)) match++; });
    score += match * 10000;
  }
  
  const dates = recipe.cookedDates || [];
  if (dates.length === 0) {
    score += 5000;
  } else {
    const now = Date.now();
    const lastEntry = dates.sort((a,b) => new Date(b.date || b) - new Date(a.date || a))[0];
    const last = new Date(lastEntry.date || lastEntry).getTime();
    const daysSince = (now - last) / (1000 * 60 * 60 * 24);
    score += Math.min(daysSince, 365) * 10;
  }
  return score;
}

// --- LOGIK FÖR ETT RECEPT ---
window.createRecipe = async () => {
  const docRef = await addDoc(collection(db, 'users', user.uid, 'recipes'), {
    title: '', content: '', tags: [], cookedDates: [], createdAt: serverTimestamp()
  });
  openRecipe(docRef.id);
};

function renderRecipeData() {
  const r = recipes.find(x => x.id === currentRecipeId);
  if(!r) return;
  
  document.getElementById('rv-title').value = r.title || '';
  const contentEl = document.getElementById('rv-content');
  contentEl.value = r.content || '';
  setTimeout(() => autoGrow(contentEl), 10);

  const tagsCont = document.getElementById('rv-tags-edit');
  tagsCont.innerHTML = '';
  (r.tags||[]).forEach(tag => {
    tagsCont.innerHTML += `<div class="tag-edit"><span>${esc(tag)}</span><span class="tag-rm" onclick="removeTag('${esc(tag)}')">✕</span></div>`;
  });
  tagsCont.innerHTML += `<input type="text" list="tag-suggestions" autocomplete="off" class="tag-input" id="tag-input" placeholder="+ Lägg till etikett" onkeydown="if(event.key==='Enter') addTagToRecipe(this)">`;

  // Samla in alla unika etiketter från hela appen och lägg in dem i datalistan
  const allTags = new Set();
  recipes.forEach(rec => (rec.tags||[]).forEach(t => allTags.add(t)));
  const dataList = document.getElementById('tag-suggestions');
  if (dataList) {
    dataList.innerHTML = Array.from(allTags).sort().map(t => `<option value="${esc(t)}">`).join('');
  }

  const dates = (r.cookedDates || []).sort((a,b) => new Date(b.date || b) - new Date(a.date || a));
  const stText = document.getElementById('stat-text');
  const stList = document.getElementById('stat-list');
  
  if (dates.length === 0) {
    stText.innerText = 'Aldrig lagad';
    stList.innerHTML = '<div class="stat-item">Ingen historik ännu.</div>';
  } else {
    const lastEntry = dates[0];
    const lastStr = new Date(lastEntry.date || lastEntry).toLocaleDateString('sv-SE', {day:'numeric', month:'short'});
    
    let validRatings = dates.filter(d => d.rating).map(d => d.rating);
    let avgRatingStr = "";
    if (validRatings.length > 0) {
        let sum = validRatings.reduce((a, b) => a + b, 0);
        let avg = (sum / validRatings.length).toFixed(1);
        avgRatingStr = ` | ★ ${avg}`;
    }

    stText.innerText = `Lagad ${dates.length} ggr${avgRatingStr} (Senast: ${lastStr})`;
    
    stList.innerHTML = dates.map(d => {
        const dateObj = new Date(d.date || d);
        const dateStr = dateObj.toLocaleDateString('sv-SE', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
        const ratingStr = d.rating ? ` <span style="color:var(--purple); margin-left:4px; font-weight:600;">★${d.rating}</span>` : '';
        const commentStr = d.comment ? `<br><span style="color:var(--ink-soft); margin-left:12px; font-style:italic; font-size:0.75rem;">"${esc(d.comment)}"</span>` : '';
        return `<div class="stat-item">• ${dateStr}${ratingStr}${commentStr}</div>`;
    }).join('');
  }
}

window.saveRecipe = async () => {
  if(!currentRecipeId) return;
  const title = document.getElementById('rv-title').value.trim();
  const content = document.getElementById('rv-content').value;
  await updateDoc(doc(db, 'users', user.uid, 'recipes', currentRecipeId), { title, content });
};

window.addTagToRecipe = async (inputEl) => {
  const val = inputEl.value.trim().toLowerCase();
  if(!val) return;
  const r = recipes.find(x => x.id === currentRecipeId);
  const tags = new Set(r.tags || []);
  tags.add(val);
  await updateDoc(doc(db, 'users', user.uid, 'recipes', currentRecipeId), { tags: Array.from(tags) });
  inputEl.value = '';
};

window.removeTag = async (tag) => {
  const r = recipes.find(x => x.id === currentRecipeId);
  const tags = (r.tags || []).filter(t => t !== tag);
  await updateDoc(doc(db, 'users', user.uid, 'recipes', currentRecipeId), { tags });
};

// --- BETYGSFUNKTIONER ---
window.cookToday = () => {
  tempRating = 0;
  document.getElementById('rating-modal').style.display = 'flex';
  document.getElementById('rating-comment').value = '';
  updateStars();
};

window.setRating = (num) => {
  tempRating = num;
  updateStars();
};

function updateStars() {
  for(let i=1; i<=5; i++) {
    document.getElementById('star-'+i).style.color = i <= tempRating ? 'var(--purple)' : 'var(--ink-faint)';
  }
}

window.closeRatingModal = () => {
  document.getElementById('rating-modal').style.display = 'none';
};

window.saveRating = async () => {
  const comment = document.getElementById('rating-comment').value.trim();
  const r = recipes.find(x => x.id === currentRecipeId);
  const dates = r.cookedDates || [];
  
  dates.push({
    date: new Date().toISOString(),
    rating: tempRating,
    comment: comment
  });
  
  await updateDoc(doc(db, 'users', user.uid, 'recipes', currentRecipeId), { cookedDates: dates });
  closeRatingModal();
  toast('Registrerat och betygsatt!');
};

window.deleteRecipe = async () => {
  if(confirm('Är du säker på att du vill ta bort receptet?')) {
    await deleteDoc(doc(db, 'users', user.uid, 'recipes', currentRecipeId));
    goHome();
  }
};

window.toggleStats = () => {
  document.getElementById('stat-list').classList.toggle('open');
};

window.autoGrow = el => {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
};

const curView = () => document.getElementById('view-list').classList.contains('active') ? 'list' : 'recipe';
const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const toast = msg => {
  const t = document.getElementById('toast'); t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
};

window.signInWithGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
window.signOut = () => fbSignOut(auth);
  // Funktion för att skapa stjärnor baserat på snittbetyg
function getStarsHtml(rating, recipeId) {
  if (!rating || rating <= 0) return '';
  let html = '<div style="display:flex; gap:2px; align-items:center;">';
  for (let i = 1; i <= 5; i++) {
    let fill = 0;
    if (rating >= i) fill = 100; // Helstjärna
    else if (rating > i - 1) fill = (rating - (i - 1)) * 100; // Delvis fylld stjärna
    
    const gradId = `grad-${recipeId}-${i}`;
    html += `
      <svg width="14" height="14" viewBox="0 0 24 24" style="flex-shrink:0;">
        <defs>
          <linearGradient id="${gradId}">
            <stop offset="${fill}%" stop-color="var(--purple)"/>
            <stop offset="${fill}%" stop-color="var(--ink-faint)"/>
          </linearGradient>
        </defs>
        <path fill="url(#${gradId})" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </svg>`;
  }
  html += '</div>';
  return html;
}
